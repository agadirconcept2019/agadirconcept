name: AC Bridge Dispatch

on:
  push:
    paths:
      - '.ac-bridge/job.json'
      - '.ac-bridge/trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger WordPress bridge job poll
        shell: bash
        run: |
          set -u -o pipefail
          JOB_ID="$(jq -r '.job_id' .ac-bridge/job.json)"
          : > .ac-bridge/status.json
          for attempt in 1 2 3; do
            curl -LfsS --retry 3 --max-time 30 "https://agadir-concept.com/new/?ac_bridge_job=${GITHUB_SHA}-${attempt}" -o /dev/null || true
            sleep 5
            curl -LfsS --retry 3 --max-time 30 "https://agadir-concept.com/new/wp-json/agadir-concept-test-bridge/v1/status?cb=${GITHUB_RUN_ID}-${attempt}" -o .ac-bridge/status.json || true

            if jq -e --arg job "$JOB_ID" '.jobs.job_id == $job and (.jobs.status == "success" or .jobs.status == "failed" or .jobs.status == "rejected" or (.jobs.status == "idle" and .jobs.message == "Job already processed."))' .ac-bridge/status.json >/dev/null 2>&1; then
              echo "Bridge job reached a known state on attempt ${attempt}."
              break
            fi

            echo "Bridge status is not usable yet; attempt ${attempt}/3."
            if [ "$attempt" -lt 3 ]; then
              sleep 65
            fi
          done

          echo '--- bridge status (raw) ---'
          cat .ac-bridge/status.json || true
          echo

          if ! jq -e --arg job "$JOB_ID" '.jobs.job_id == $job and (.jobs.status == "success" or (.jobs.status == "idle" and .jobs.message == "Job already processed."))' .ac-bridge/status.json >/dev/null 2>&1; then
            echo "Bridge job did not finish successfully."
            exit 1
          fi

      - name: Fetch runtime diagnostic
        shell: bash
        run: |
          set -u -o pipefail
          echo '--- AC runtime diagnostic ---'
          curl -LfsS --retry 2 --max-time 30 "https://agadir-concept.com/new/wp-json/ac-runtime-diagnostic/v1/status?cb=${GITHUB_RUN_ID}" -o /tmp/ac-runtime.json || true
          if jq -e '.ok == true' /tmp/ac-runtime.json >/dev/null 2>&1; then
            jq . /tmp/ac-runtime.json
          else
            echo "Runtime diagnostic endpoint unavailable."
            cat /tmp/ac-runtime.json 2>/dev/null || true
          fi

      - name: Verify public endpoints
        shell: bash
        run: |
          set -u -o pipefail
          curl -LfsS --retry 3 --max-time 30 "https://agadir-concept.com/new/wp-json/wp/v2/pages?per_page=100&orderby=menu_order&order=asc&_fields=id,slug,parent,status,link,title" -o /tmp/ac-pages.json || true
          if jq -e 'type == "array"' /tmp/ac-pages.json >/dev/null 2>&1; then
            echo "WordPress pages REST endpoint is valid JSON."
          else
            echo "WordPress pages REST endpoint is currently unavailable or invalid."
          fi

          code="$(curl -LsS -o /tmp/ac-home.html -w '%{http_code}' --max-time 30 "https://agadir-concept.com/new/?qa=${GITHUB_RUN_ID}" || true)"
          echo "Homepage HTTP status: ${code}"
          echo "Homepage bytes: $(wc -c < /tmp/ac-home.html 2>/dev/null || echo 0)"

      - name: Render homepage QA PDF
        shell: bash
        run: |
          set -u -o pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary available on runner."
            exit 0
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --no-pdf-header-footer --print-to-pdf=/tmp/agadir-home-qa.pdf "https://agadir-concept.com/new/?visualqa=${GITHUB_RUN_ID}" || true
          if [ -s /tmp/agadir-home-qa.pdf ]; then
            echo "QA PDF generated: $(wc -c < /tmp/agadir-home-qa.pdf) bytes"
          else
            echo "QA PDF was not generated."
          fi

      - name: Upload homepage QA artifact
        if: ${{ hashFiles('/tmp/agadir-home-qa.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: agadir-home-qa-${{ github.run_id }}
          path: /tmp/agadir-home-qa.pdf
          retention-days: 3
