name: AC Bridge Dispatch

on:
  push:
    paths:
      - '.ac-bridge/job.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger WordPress bridge job poll
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID="$(jq -r '.job_id' .ac-bridge/job.json)"
          for attempt in 1 2 3; do
            curl -LfsS --retry 3 --max-time 30 "https://agadir-concept.com/new/?ac_bridge_job=${GITHUB_SHA}-${attempt}" -o /dev/null || true
            sleep 5
            curl -LfsS --retry 3 --max-time 30 "https://agadir-concept.com/new/wp-json/agadir-concept-test-bridge/v1/status?cb=${GITHUB_RUN_ID}-${attempt}" -o .ac-bridge/status.json || true
            if jq -e --arg job "$JOB_ID" '.jobs.job_id == $job and (.jobs.status == "success" or .jobs.status == "failed" or .jobs.status == "rejected")' .ac-bridge/status.json >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 65
            fi
          done
          cat .ac-bridge/status.json

      - name: Publish bridge status snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agadirconcept-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add .ac-bridge/status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update AC Bridge job status"
          git push
