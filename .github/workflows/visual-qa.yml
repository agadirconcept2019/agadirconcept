name: Agadir Concept Visual QA

on:
  push:
    paths:
      - '.github/workflows/visual-qa.yml'
      - '.ac-bridge/visual-qa-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify homepage
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -LsS -o /tmp/home.html -w '%{http_code}' --max-time 30 'https://agadir-concept.com/new/?visualqa=1')"
          echo "Homepage HTTP status: ${code}"
          echo "Homepage bytes: $(wc -c < /tmp/home.html)"
          test "$code" = "200"

      - name: Render desktop PDF
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found"
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --no-pdf-header-footer --print-to-pdf=/tmp/agadir-home-desktop.pdf 'https://agadir-concept.com/new/?visualqa=desktop'
          test -s /tmp/agadir-home-desktop.pdf
          echo "PDF bytes: $(wc -c < /tmp/agadir-home-desktop.pdf)"

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: agadir-home-desktop-${{ github.run_id }}
          path: /tmp/agadir-home-desktop.pdf
          if-no-files-found: error
          retention-days: 3
